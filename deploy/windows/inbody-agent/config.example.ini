; GymFlow InBody Agent — configuration
;
; The installer writes this file for you. Edit it here if something changes,
; then restart the task:  Restart-ScheduledTask -TaskName "GymFlow InBody Agent"

[inbody-agent]

; The folder LookinBody120 auto-exports one CSV per scan into
; (Setup Menu -> "Export Data as CSV/Image Files").
folder = C:\LookinBody120\EMR\CSV

; GymFlow API base URL. Must be https:// in production.
api_url = https://gymflow.example.com

; The GymFlow branch id this gym maps to.
branch_id = 1

; The shared secret (INBODY_INGEST_SHARED_SECRET). Prefer secret_file so the
; value is not in this file. The installer locks the file's ACL to SYSTEM +
; Administrators. Alternatively set the INBODY_INGEST_SHARED_SECRET env var.
secret_file = C:\GymFlow\InBodyAgent\secret
; secret = paste-it-here-instead-if-you-must

; Where state, logs, status.json and quarantine notes are kept. Never the
; watched folder. Defaults to this config file's directory if omitted.
work_dir = C:\GymFlow\InBodyAgent

; Optional: PEM file to verify a private / LAN server certificate.
; cacert = C:\GymFlow\InBodyAgent\gymflow.crt

; How often to scan the folder, and how often to send a status heartbeat.
poll_seconds = 30
heartbeat_seconds = 120

; Only for a short trusted-LAN test. Never leave this on.
; insecure = true
