# Codespaces / Dev Containers runtime for GymFlow AI.
#
# Everything the project needs runs as a container here: Node, Python and
# PostgreSQL. Nothing is installed on the host, and the Android build happens
# on EAS's servers rather than in a local Android Studio.

services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    volumes:
      - ../..:/workspaces:cached
    # Keep the container alive; the dev container attaches to it.
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The API and the tests reach Postgres by service name — there is no
      # database on the host and none is expected.
      DATABASE_URL: postgresql+psycopg://gymflow:gymflow@db:5432/gymflow
      TEST_DATABASE_URL: postgresql+psycopg://gymflow:gymflow@db:5432/gymflow_test
      PGHOST: db
      PGUSER: gymflow
      PGPASSWORD: gymflow
      PGDATABASE: gymflow

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - gymflow-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: gymflow
      POSTGRES_PASSWORD: gymflow
      POSTGRES_DB: gymflow
    healthcheck:
      # Name the user and database: pg_isready with no -U connects as the
      # invoking OS user, which is root inside the health-check exec.
      test: ['CMD-SHELL', 'pg_isready -U gymflow -d gymflow']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gymflow-db:
