name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config:
    name: Config — devcontainer and workflows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A broken devcontainer.json only shows up when someone waits five
      # minutes for a Codespace to fail to build.
      - name: Shell scripts parse
        run: |
          for script in .devcontainer/*.sh; do
            bash -n "$script" && echo "ok  $script"
          done

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning .devcontainer/*.sh

      - name: devcontainer.json and compose parse
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.devcontainer/docker-compose.yml')); print('compose ok')"
          node -e "
            const fs = require('fs');
            // devcontainer.json is jsonc; strip line comments before parsing.
            const raw = fs.readFileSync('.devcontainer/devcontainer.json', 'utf8')
              .replace(/^\s*\/\/.*$/gm, '');
            const cfg = JSON.parse(raw);
            if (!cfg.service || !cfg.dockerComposeFile) throw new Error('compose wiring missing');
            console.log('devcontainer.json ok');
          "

      - name: Workflows parse
        run: |
          python3 - <<'PY'
          import pathlib, yaml
          for f in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(f.read_text())
              print('ok ', f)
          PY

      - name: eas.json is valid and preview ships an APK
        run: |
          node -e "
            const eas = require('./apps/mobile/eas.json');
            const preview = eas.build.preview;
            if (preview.android.buildType !== 'apk') throw new Error('preview must build an APK');
            if (preview.distribution !== 'internal') throw new Error('preview must be internal');
            // A committed API URL would ship a build pointing at a fake domain.
            if (preview.env?.EXPO_PUBLIC_API_URL) {
              throw new Error('preview must not hardcode an API URL — the build workflow supplies it');
            }
            console.log('eas.json ok');
          "

  backend:
    name: Backend — lint, format, tests
    runs-on: ubuntu-latest

    # The suite runs against a real PostgreSQL so enum types, JSONB and
    # timezone-aware columns behave as they will in production. On SQLite the
    # attendance assertions fail in ways that look like product bugs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymflow
          POSTGRES_PASSWORD: gymflow
          POSTGRES_DB: gymflow_test
        ports: ['5432:5432']
        # pg_isready with no -U connects as the invoking OS user, which is root
        # inside the health-check exec — a role Postgres does not have. Name the
        # user and the database so the check reports the truth.
        options: >-
          --health-cmd "pg_isready -U gymflow -d gymflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Lint
        run: ruff check app ../tests
        working-directory: backend

      - name: Format check
        run: ruff format --check app ../tests
        working-directory: backend

      # A separate, empty database: proves the migrations build the schema on
      # their own, rather than the tests' create_all having done it.
      - name: Create a scratch database for the migration check
        run: PGPASSWORD=gymflow createdb -h localhost -U gymflow gymflow_migrations

      - name: Migrations apply cleanly from scratch
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://gymflow:gymflow@localhost:5432/gymflow_migrations
          SECRET_KEY: ci-only-secret-not-used-for-anything-real-0123456789

      - name: Tests
        run: pytest ../tests/backend
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://gymflow:gymflow@localhost:5432/gymflow_test
          SECRET_KEY: ci-only-secret-not-used-for-anything-real-0123456789
          ENVIRONMENT: test
          RATE_LIMIT_ENABLED: 'false'
          BCRYPT_ROUNDS: '4'

  mobile:
    name: Mobile — typecheck, tests, bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/mobile

      # Catches app.json keys the installed SDK does not accept. expo-doctor
      # runs the same check, but only by downloading the schema — this one
      # works offline and runs on every PR.
      - name: Validate app.json against the installed SDK
        run: npm run validate:config
        working-directory: apps/mobile

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/mobile

      - name: Tests
        run: npm run test:ci
        working-directory: apps/mobile

      # The fastest way to catch a broken import or a bad route: if Metro can
      # bundle it, the app starts.
      - name: Android bundle
        run: npx expo export --platform android --output-dir /tmp/export-android
        working-directory: apps/mobile

      - name: iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/export-ios
        working-directory: apps/mobile

  web-demo:
    name: Web demo — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-demo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web-demo

      - name: Build
        run: npm run build
        working-directory: apps/web-demo
